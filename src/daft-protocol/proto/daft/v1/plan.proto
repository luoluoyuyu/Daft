  JOIN_STRATEGY_CROSS = 4;
  JOIN_STRATEGY_KEY_FILTERING = 5;
}

enum JoinSide {
  JOIN_SIDE_UNSPECIFIED = 0;
  JOIN_SIDE_LEFT = 1;
  JOIN_SIDE_RIGHT = 2;
}

enum CountMode {
  COUNT_MODE_UNSPECIFIED = 0;
  COUNT_MODE_ALL = 1;
  COUNT_MODE_VALID = 2;
  COUNT_MODE_NULL = 3;
}

enum SketchType {
  SKETCH_TYPE_UNSPECIFIED = 0;
  SKETCH_TYPE_DD_SKETCH = 1;
  SKETCH_TYPE_HYPER_LOG_LOG = 2;
}

enum OnError {
  ON_ERROR_UNSPECIFIED = 0;
  ON_ERROR_RAISE = 1;
  ON_ERROR_LOG = 2;
  ON_ERROR_IGNORE = 3;
}

enum FileFormat {
  FILE_FORMAT_UNSPECIFIED = 0;
  FILE_FORMAT_PARQUET = 1;
  FILE_FORMAT_WARC = 2;
  FILE_FORMAT_TEXT = 3;
