enum UnionStrategy {
  UNION_STRATEGY_UNSPECIFIED = 0;
  UNION_STRATEGY_POSITIONAL = 1;
  UNION_STRATEGY_BY_NAME = 2;
}

enum ShardingStrategy {
  SHARDING_STRATEGY_UNSPECIFIED = 0;
  SHARDING_STRATEGY_FILE = 1;
}

enum TimeUnit {
  TIME_UNIT_UNSPECIFIED = 0;
  TIME_UNIT_NANOSECONDS = 1;
  TIME_UNIT_MICROSECONDS = 2;
  TIME_UNIT_MILLISECONDS = 3;
  TIME_UNIT_SECONDS = 4;
}

enum ImageMode {
  IMAGE_MODE_UNSPECIFIED = 0;
  IMAGE_MODE_L = 1;
  IMAGE_MODE_LA = 2;
  IMAGE_MODE_RGB = 3;
  IMAGE_MODE_RGBA = 4;
  IMAGE_MODE_L16 = 5;
  IMAGE_MODE_LA16 = 6;
  IMAGE_MODE_RGB16 = 7;
  IMAGE_MODE_RGBA16 = 8;
  IMAGE_MODE_RGB32F = 9;
  IMAGE_MODE_RGBA32F = 10;
