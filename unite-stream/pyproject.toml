[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "unite-stream"
version = "0.1.0"
description = "Parser/runtime separation for Daft with cloudpickle IR transport"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# We pin to the custom local-tagged Daft wheel built from this monorepo
# (see Cargo.toml workspace.package.version). The `+unite` PEP 440 local
# segment guarantees the requirement can only ever be satisfied by the
# bundled wheel, never by any public PyPI daft release. Bump both sides
# together via `make bundle`.
dependencies = [
  "cloudpickle>=3.1.0,<4.0.0",
  "daft==0.3.0.dev0+unite",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["unite_stream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
